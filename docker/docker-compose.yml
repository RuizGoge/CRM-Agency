# Local development database. Phase 5 rung 0: cost USD 0, no provider, no terms
# of service, no limits. Same major version as production, so the local
# environment is the same shape rather than an approximation of it.
name: crm-leads-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: crm-leads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_dev
      # Deterministic collation: ORDER BY on seller names must not differ
      # between a developer machine and production.
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US'
    ports:
      - '5432:5432'
    volumes:
      # PG 18+ convention: mount the PARENT, not .../data. From 18 the official
      # image stores the cluster in a major-version-specific subdirectory, and
      # it REFUSES TO BOOT (restart loop) if a volume is mounted at the old
      # .../data path. Reverting this to /var/lib/postgresql/data breaks
      # `npm run db:up` entirely. See docker-library/postgres#1259.
      - crm-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crm-pgdata:
